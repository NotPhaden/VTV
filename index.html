}


.container{

.link{

padding:18px 20px;

color:#cfe8ff;

font-weight:600;

background:rgba(255,255,255,0.03);

border:1px solid rgba(0,170,255,0.10);

transition:0.25s;
position:relative;
overflow:hidden;
}

.link::before{
content:"";
position:absolute;
inset:0;

background:linear-gradient(
90deg,
rgba(0,170,255,0.12),
transparent
);

opacity:0;
transition:0.25s;
}

.link:hover{
transform:translateY(-2px) scale(1.01);

border-color:rgba(0,170,255,0.3);

box-shadow:
0 0 25px rgba(0,140,255,0.12);
}

.link:hover::before{
opacity:1;
}

.icon{
margin-right:8px;

.arrow{
opacity:0.6;

0 0 18px rgba(0,140,255,0.05);
}


footer{
